<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple STT and TTS Test Page</title>
</head>
<body>
    <h1>Test Speech APIs</h1>
    <p>Speech generation via Web APIs.</p>
	<input id="inputWords" type="text" name="words"> Enter text to speak</input>
	<button onclick="speakSpecific(document.getElementById('inputWords').value)">Entered text</button>
	<button onclick="speakCanned()">Canned Text</button>
	<button onclick="recognition.start()">Start listening</button>
	<button onclick="recognition.stop()">Stop listening</button>
	<div id="transcribed" placeholder = "Text will go here..."></div>
</body>
<script>
function speakCanned() {
	const talky = new SpeechSynthesisUtterance("This is a test of the emergency broadcast system");
	window.speechSynthesis.speak(talky);
}
function speakSpecific(text) {
	const talky = new SpeechSynthesisUtterance(text);
	window.speechSynthesis.speak(talky);
}

//Main	
const recognition = new window.webkitSpeechRecognition();
const transcriptDiv = document.getElementById('transcribed');
let finalTranscript = '';

recognition.onresult = (event) => {
	let interimTranscript = '';
	for (let i = event.resultIndex; i < event.results.length; ++i) {
	if (event.results[i].isFinal) {
		finalTranscript += event.results[i][0].transcript + ' ';
		} else {
			interimTranscript += event.results[i][0].transcript;}
		}
	transcriptDiv.innerHTML = `<strong>${finalTranscript}</strong><span style="color: #888;">${interimTranscript}</span>`;
	finalTranscript = '';
};

</script>
</html>
